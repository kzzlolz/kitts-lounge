<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitty Crumbs Bakery - Under Maintenance</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧁</text></svg>">

  <meta property="og:type" content="website">
  <meta property="og:title" content="🌸 Kitty Crumbs Bakery 🧁">
  <meta property="og:description" content="Under Maintenance! Be right back :3">
  <meta property="og:image" content="https://c.tenor.com/yBw98jgTgAoAAAAC/tenor.gif">
  <meta name="theme-color" content="#f8bbd0">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Pacifico&family=Sacramento&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: url("https://c.tenor.com/yBw98jgTgAoAAAAC/tenor.gif") no-repeat center center fixed;
      background-size: cover;
      font-family: 'Fredoka', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: auto;
    }

    /* Main Maintenance Shell */
    #widget-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      max-width: 600px;
      min-height: 400px;
      background-color: rgba(62, 44, 52, 0.9);
      border: 4px solid #b3889b;
      border-radius: 20px;
      padding: 40px 30px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      color: #ffdce5;
      position: relative;
      overflow: hidden;
      
      transform: translateY(20px);
      opacity: 0;
      transition: transform 0.6s ease, opacity 0.6s ease;
    }

    #widget-wrapper.slide-up {
      transform: translateY(0);
      opacity: 1;
    }

    .maintenance-logo {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid #f8bbd0;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      margin-bottom: 20px;
    }

    .maintenance-title {
      font-size: 2rem;
      color: #fff;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .maintenance-message {
      font-size: 1.1rem;
      color: #ffccd5;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .server-invite-link {
      display: inline-block;
      background-color: #f48fb1;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      box-shadow: 0 4px 10px rgba(244, 143, 177, 0.3);
      transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .server-invite-link:hover {
      transform: translateY(-2px);
      background-color: #f06292;
      box-shadow: 0 6px 15px rgba(240, 98, 146, 0.4);
    }

    /* Floating Cupcakes Background Animation */
    #widget-wrapper::before {
      content: "🧁";
      position: absolute;
      font-size: 1.5rem;
      pointer-events: none;
      z-index: 20;
      bottom: -40px;
      left: 15%;
      filter: drop-shadow(120px -80px 0 rgba(255, 255, 255, 0.9)) drop-shadow(260px 40px 0 rgba(255, 255, 255, 0.9));
      animation: floatUpSlow 7s linear infinite;
    }

    #widget-wrapper::after {
      content: "✨🧁";
      position: absolute;
      font-size: 1.3rem;
      pointer-events: none;
      z-index: 20;
      bottom: -40px;
      left: 55%;
      filter: drop-shadow(150px -120px 0 rgba(255, 255, 255, 0.9));
      animation: floatUpFast 5s linear infinite;
      animation-delay: 2.5s;
    }

    @keyframes floatUpSlow {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.85; }
      90% { opacity: 0.85; }
      100% { transform: translateY(-90vh) rotate(20deg); opacity: 0; }
    }

    @keyframes floatUpFast {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      15% { opacity: 0.9; }
      85% { opacity: 0.9; }
      100% { transform: translateY(-90vh) rotate(-25deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <div id="widget-wrapper">
    <img src="https://i.ibb.co/tTND3MRX/Untitled-design.png" alt="Kitty Crumbs Logo" class="maintenance-logo">
    <h1 class="maintenance-title">Under Maintenance!</h1>
    <p class="maintenance-message">We are baking up some fresh updates for the bakery. We'll be right back :3</p>
    <div>
      <a class="server-invite-link" href="https://discord.gg/nET4TTnRuA" target="_blank" rel="noopener"><i class="fa-brands fa-discord"></i> Join Discord Server</a>
    </div>
    <div style="font-size: 0.75rem; opacity: 0.5; margin-top: 30px;">
      Kitty Crumbs v1.6 🧁
    </div>
  </div>

  <script>
    // Simple script to trigger the slide-up animation on load
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        document.getElementById('widget-wrapper').classList.add('slide-up');
      }, 100);
    });
  </script>
